<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ảnh album cưới 4">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E4D3"/>
      <stop offset="1" stop-color="#E6C9AC"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <g id="sprig">
      <path d="M0 0 C 30 -20 70 -35 130 -42" fill="none" stroke="#B9975B" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
      <ellipse cx="30" cy="-18" rx="16" ry="5.5" fill="#B9975B" opacity=".45" transform="rotate(-38 30 -18)"/>
      <ellipse cx="34" cy="-14" rx="16" ry="5.5" fill="#B9975B" opacity=".3" transform="rotate(142 34 -14)"/>
      <ellipse cx="58" cy="-27" rx="17" ry="6" fill="#B9975B" opacity=".45" transform="rotate(-32 58 -27)"/>
      <ellipse cx="62" cy="-23" rx="17" ry="6" fill="#B9975B" opacity=".3" transform="rotate(148 62 -23)"/>
      <ellipse cx="90" cy="-35" rx="16" ry="5.5" fill="#B9975B" opacity=".45" transform="rotate(-28 90 -35)"/>
      <ellipse cx="94" cy="-31" rx="16" ry="5.5" fill="#B9975B" opacity=".3" transform="rotate(152 94 -31)"/>
      <circle cx="130" cy="-42" r="6" fill="#B9975B" opacity=".6"/>
    </g>
    <g id="blossom">
      <g fill="#D8A883" opacity=".55">
        <ellipse cx="0" cy="-14" rx="7" ry="13"/>
        <ellipse cx="0" cy="-14" rx="7" ry="13" transform="rotate(72)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="13" transform="rotate(144)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="13" transform="rotate(216)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="13" transform="rotate(288)"/>
      </g>
      <circle r="5" fill="#B9975B" opacity=".8"/>
    </g>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <circle cx="400" cy="450" r="250" fill="none" stroke="#B9975B" stroke-width="2" opacity=".45"/>
  <use href="#blossom" transform="translate(400 450) scale(2)"/>
  <use href="#blossom" transform="translate(220 300) scale(.9)"/>
  <use href="#blossom" transform="translate(580 620) scale(.9)"/>
  <use href="#sprig" transform="translate(20 990) rotate(-14) scale(1.9)"/>
  <use href="#sprig" transform="translate(790 1000) rotate(-74) scale(1.9)"/>
  <circle cx="650" cy="180" r="26" fill="#B9975B" opacity=".1"/>
</svg>
