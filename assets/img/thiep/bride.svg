<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ảnh cô dâu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF0E9"/>
      <stop offset="1" stop-color="#EFDBD2"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".38" r=".6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <g id="sprig">
      <path d="M0 0 C 30 -20 70 -35 130 -42" fill="none" stroke="#C9A96A" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
      <ellipse cx="30" cy="-18" rx="16" ry="5.5" fill="#C9A96A" opacity=".45" transform="rotate(-38 30 -18)"/>
      <ellipse cx="34" cy="-14" rx="16" ry="5.5" fill="#C9A96A" opacity=".3" transform="rotate(142 34 -14)"/>
      <ellipse cx="58" cy="-27" rx="17" ry="6" fill="#C9A96A" opacity=".45" transform="rotate(-32 58 -27)"/>
      <ellipse cx="62" cy="-23" rx="17" ry="6" fill="#C9A96A" opacity=".3" transform="rotate(148 62 -23)"/>
      <ellipse cx="90" cy="-35" rx="16" ry="5.5" fill="#C9A96A" opacity=".45" transform="rotate(-28 90 -35)"/>
      <ellipse cx="94" cy="-31" rx="16" ry="5.5" fill="#C9A96A" opacity=".3" transform="rotate(152 94 -31)"/>
      <circle cx="130" cy="-42" r="6" fill="#C9A96A" opacity=".6"/>
      <circle cx="140" cy="-48" r="3.5" fill="#C9A96A" opacity=".4"/>
    </g>
    <g id="blossom">
      <g fill="#D9A79A" opacity=".55">
        <ellipse cx="0" cy="-14" rx="7" ry="13"/>
        <ellipse cx="0" cy="-14" rx="7" ry="13" transform="rotate(72)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="13" transform="rotate(144)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="13" transform="rotate(216)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="13" transform="rotate(288)"/>
      </g>
      <circle r="5" fill="#C9A96A" opacity=".8"/>
    </g>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <circle cx="400" cy="400" r="270" fill="none" stroke="#C9A96A" stroke-width="2" opacity=".5"/>
  <circle cx="400" cy="400" r="284" fill="none" stroke="#C9A96A" stroke-width="1" stroke-dasharray="2 7" opacity=".45"/>
  <use href="#sprig" transform="translate(30 980) rotate(-16) scale(2)"/>
  <use href="#sprig" transform="translate(780 990) rotate(-72) scale(2)"/>
  <use href="#blossom" transform="translate(120 200)"/>
  <use href="#blossom" transform="translate(690 320) scale(.8)"/>
  <use href="#blossom" transform="translate(650 830) scale(.6)"/>
  <use href="#blossom" transform="translate(160 760) scale(.5)"/>
  <circle cx="640" cy="150" r="34" fill="#C9A96A" opacity=".08"/>
  <circle cx="150" cy="420" r="22" fill="#C9A96A" opacity=".1"/>
</svg>
